# Maverick stack (stage S1): sim, bridge, host, referee. See docs/s1-plan.md "Topology".
#   just up                      # whole stack
#   COMPOSE_PROJECT_NAME=mavB just up   # parallel stacks need other names AND other subnets
# Gazebo GUI (host: Wayland + XWayland on :0):
#   xhost +local:            # once per login session, allows the container to use X
#   just sim 1
#
# Networks (fixed subnets, picked outside Docker's default 172.16/12 pools; only one stack
# can run at a time):
#   drone  10.231.1.0/24  sim .2, bridge .3   (stands in for the serial cable, no netem)
#   wifi   10.231.2.0/24  host .2, bridge .3  (netem on both ends)
#   world  10.231.3.0/24  sim .2, referee .3  (ground truth; host and bridge are not here)
name: maverick

x-maverick: &maverick
  image: maverick-sim:s3
  init: true                         # reap zombies, forward signals
  volumes:
    - ..:/maverick                   # repo root, read-write (image user is uid 1000)
  environment: &maverick-env
    # DDS never crosses a container boundary; only XRCE (drone) and Zenoh (wifi) do.
    ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    ROS_DOMAIN_ID: "0"
    RUST_LOG: "${RUST_LOG:-info}"       # zenoh-bridge-ros2dds log level
    MAVERICK_DRONE: "${MAVERICK_DRONE:-small}"   # small | x500: one switch for model, airframe, worldgen, planner

services:
  sim:
    <<: *maverick
    build:
      context: ..                      # repo root
      dockerfile: docker/sim.Dockerfile
    stop_grace_period: 20s
    shm_size: "1gb"
    volumes:
      - ..:/maverick
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket for the Gazebo GUI
      # Both drones are mounted; MAVERICK_DRONE (small | x500, default small) picks the one PX4
      # starts (the entrypoint sets PX4_SIM_MODEL). See sim/px4/README.md.
      #   x500  : 4500_gz_maverick (x500_flow + Maverick PX4 params), model `maverick`
      #   small : 4501_gz_maverick_small (sources 4500), model `maverick_small`
      - ../sim/px4/airframes/4500_gz_maverick:/opt/PX4-Autopilot/build/px4_sitl_default/etc/init.d-posix/airframes/4500_gz_maverick:ro
      - ../sim/px4/airframes/4501_gz_maverick_small:/opt/PX4-Autopilot/build/px4_sitl_default/etc/init.d-posix/airframes/4501_gz_maverick_small:ro
      - ../sim/models/maverick:/opt/PX4-Autopilot/Tools/simulation/gz/models/maverick:ro
      - ../sim/models/maverick_small:/opt/PX4-Autopilot/Tools/simulation/gz/models/maverick_small:ro
      # The entrypoint is baked into the image; mounting it lets PX4_GZ_WORLDS take effect
      # without a rebuild (it patches gz_env.sh, which otherwise forces PX4's own worlds dir).
      - ../docker/sim-entrypoint.sh:/usr/local/bin/sim-entrypoint.sh:ro
    environment:
      <<: *maverick-env
      HEADLESS: "${HEADLESS:-1}"       # 1 = no Gazebo GUI, 0 = show it
      DISPLAY: "${DISPLAY:-:0}"
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      PX4_SIM_MODEL: "${PX4_SIM_MODEL:-}"   # empty: derived from MAVERICK_DRONE by the entrypoint
      # Optical flow needs a textured floor: on PX4's plain default world the EKF reports
      # zero motion while the drone drifts away (measured in S1, sim/px4/README.md).
      PX4_GZ_WORLD: "${PX4_GZ_WORLD:-textured}"
      # Worlds directory: <PX4_GZ_WORLDS>/<PX4_GZ_WORLD>.sdf. Default keeps the textured world
      # (sim/worlds/textured.sdf); generated flats: PX4_GZ_WORLDS=/maverick/sim/worlds/generated
      # PX4_GZ_WORLD=apt_<seed> PX4_GZ_MODEL_POSE="x,y,0,0,0,yaw" (referee.s3 sets all three).
      PX4_GZ_WORLDS: "${PX4_GZ_WORLDS:-/maverick/sim/worlds}"
      MAVERICK_LOCALISATION: "${MAVERICK_LOCALISATION:-flow}"   # flow | mocap | vo (S3 runner sets it)
      MAVERICK_EV_DELAY: "${MAVERICK_EV_DELAY:-40}"   # EKF2_EV_DELAY ms
      MAVERICK_EV_CTRL: "${MAVERICK_EV_CTRL:-}"   # EKF2_EV_CTRL override (default: 9 for mocap/vo, else 0)
      PX4_GZ_MODEL_POSE: "${PX4_GZ_MODEL_POSE:-}"   # empty: PX4 spawns at the world origin
      ROS_DOMAIN_ID: "${PX4_DDS_DOMAIN_ID:-1}"   # rcS copies it to UXRCE_DDS_DOM_ID
      GZ_IP: 10.231.3.2                # Gazebo transport on `world`, so the referee can see it
      # PX4's uXRCE-DDS client connects to the agent in the bridge container:
      # 182911235 = 10.231.1.3 as an integer (the bridge's address on `drone`).
      PX4_PARAM_UXRCE_DDS_AG_IP: "182911235"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      drone: {ipv4_address: 10.231.1.2}
      world: {ipv4_address: 10.231.3.2}

  bridge:
    <<: *maverick
    command: ["bridge-entrypoint.sh"]
    volumes:
      - ..:/maverick
      - ../docker/bridge-entrypoint.sh:/usr/local/bin/bridge-entrypoint.sh:ro   # image copy may be stale
    environment:
      <<: *maverick-env
      PX4_DDS_DOMAIN_ID: "${PX4_DDS_DOMAIN_ID:-1}"   # domain of the XRCE agent / PX4 side
    stop_grace_period: 5s
    cap_add: [NET_ADMIN]               # tc netem on the wifi interface
    networks:
      drone: {ipv4_address: 10.231.1.3}
      wifi: {ipv4_address: 10.231.2.3}

  host:
    <<: *maverick
    command: ["host-entrypoint.sh"]
    volumes:
      - ..:/maverick
      - ../docker/host-entrypoint.sh:/usr/local/bin/host-entrypoint.sh:ro   # image copy may be stale
    stop_grace_period: 5s
    cap_add: [NET_ADMIN]
    environment:
      <<: *maverick-env
      MAVERICK_HOST_LAUNCH: "${MAVERICK_HOST_LAUNCH:-none}"   # "s3" starts the S3 host stack
      MAVERICK_LAUNCH_ARGS: "${MAVERICK_LAUNCH_ARGS:-}"
      MAVERICK_LOCALISATION: "${MAVERICK_LOCALISATION:-flow}"
    env_file:                          # model API keys (DEEPSEEK_API_KEY, ANTHROPIC_API_KEY);
      - path: .env.secrets             # git-ignored, optional: without it the agent runs scripted
        required: false
    ports:
      - "127.0.0.1:8765:8765"          # Mission Console gateway (websocket), localhost only
    networks:
      wifi: {ipv4_address: 10.231.2.2}

  referee:
    <<: *maverick
    command: ["sleep", "infinity"]     # scenarios, ground truth and fault injection come later
    stop_grace_period: 2s
    environment:
      <<: *maverick-env
      GZ_IP: 10.231.3.3
    volumes:
      - ..:/maverick
      # Root-equivalent access to the host Docker daemon: lets the referee inject faults
      # (netem, process kills) in other containers. Local development only.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"           # gid owning the socket (justfile sets it from stat)
    networks:
      world: {ipv4_address: 10.231.3.3}

  # One-off tool runs (colcon build, pytest, ruff): no fixed IPs, so they work while the stack
  # is up. `docker compose --profile tools run --rm tools <cmd>`.
  tools:
    <<: *maverick
    profiles: [tools]
    network_mode: none

networks:
  drone:
    ipam: {config: [{subnet: 10.231.1.0/24}]}
  wifi:
    ipam: {config: [{subnet: 10.231.2.0/24}]}
  world:
    ipam: {config: [{subnet: 10.231.3.0/24}]}

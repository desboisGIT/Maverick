name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      # Simulation runs (Gazebo/PX4/ROS 2 in Docker) are added to CI later.
      - run: ruff check .
      - run: python -m pytest

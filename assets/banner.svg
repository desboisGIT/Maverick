<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Maverick — missions, maps, motion</title><desc id="desc">Indoor drone autonomy in simulation. A stylised floor plan illustrates exploration; it is not a flight result.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10172b"/><stop offset="1" stop-color="#162a36"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#73bfb0" stroke-opacity=".09"/></pattern></defs><rect width="1200" height="300" rx="16" fill="url(#bg)"/><rect width="1200" height="300" rx="16" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="45" y="66" font-size="15" letter-spacing="4" fill="#6ce4ca">ROBOTICS / SPATIAL REASONING / AGENTS</text><text x="42" y="149" font-size="76" font-weight="700" letter-spacing="-3" fill="#f0f6ff">MAVERICK</text><text x="46" y="194" font-size="25" fill="#c3d7e7">Give it a mission. See how it reasons.</text><text x="46" y="251" font-size="16" fill="#82a8bd">ROS 2 · PX4 · Gazebo · Python · TypeScript</text></g><g transform="translate(760 38)" fill="none"><path d="M0 0h360v224H0ZM0 115h90m45 0h90m45 0h90M185 0v74m0 45v105M85 115v109" stroke="#88b7bd" stroke-width="5"/><path d="M45 182 45 65 145 65 145 180 240 180 290 63 325 63" stroke="#68efd0" stroke-width="2.5" stroke-dasharray="7 7"/><circle cx="240" cy="180" r="29" fill="#68efd0" fill-opacity=".1" stroke="#68efd0"/><path d="m240 167 11 21-11-5-11 5Z" fill="#68efd0" stroke="#68efd0"/><circle cx="325" cy="63" r="7" fill="#ac9dff"/></g></svg>

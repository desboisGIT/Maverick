<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">Maverick architecture</title><desc id="desc">Console and agent request typed skills, mapping and memory inform navigation, safety-gated flight goals pass through a bridge to PX4. The referee scores simulation separately.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#6ce4ca"/></marker></defs><rect width="1200" height="280" rx="14" fill="#101b2c"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#192b40" stroke="#3b586e"><rect x="30" y="87" width="180" height="88" rx="10"/><rect x="265" y="87" width="180" height="88" rx="10"/><rect x="500" y="87" width="180" height="88" rx="10"/><rect x="735" y="87" width="180" height="88" rx="10"/><rect x="970" y="87" width="200" height="88" rx="10"/><rect x="342" y="206" width="414" height="49" rx="8"/></g><g font-size="18" font-weight="700" fill="#edf6ff"><text x="120" y="121">Mission Console</text><text x="355" y="121">Agent</text><text x="590" y="121">Skills</text><text x="825" y="121">Flight + bridge</text><text x="1070" y="121">PX4 / Gazebo</text></g><g font-size="14" fill="#a7c0d5"><text x="120" y="149">WebSocket gateway</text><text x="355" y="149">Typed tool calls</text><text x="590" y="149">Plan and execute</text><text x="825" y="149">Safety-gated goals</text><text x="1070" y="149">Control + sensors</text><text x="549" y="236">Mapping + scene memory → navigation context</text><text x="600" y="41" fill="#6ce4ca" letter-spacing="2">HIGH-LEVEL INTENT → TYPED SKILLS → FLIGHT CONTROL</text></g></g><g stroke="#6ce4ca" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M216 132h37"/><path d="M451 132h37"/><path d="M686 132h37"/><path d="M921 132h37"/><path d="M549 205v-23"/></g></svg>
